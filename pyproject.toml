[project]
name = "vela"
version = "0.1.0"
description = "Vela: un viaggio di padel o tennis con hotel da un solo intento, prenotato su House of Journeys."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "mcp>=1.2",
    "stripe>=10",
    "anthropic>=1.8.0",
]

[dependency-groups]
dev = [
    "locust>=2.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vela*"]
