# Blueprint Render: web service Docker, static site della landing e Postgres gestito (spec RNF-11).
# Le variabili con `sync: false` vanno inserite a mano nella dashboard, mai nel repo.
services:
  - type: web
    name: vela
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /health
    buildFilter:
      ignoredPaths:
        - landing/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vela-db
          property: connectionString
      - key: VELA_UPSTREAM_MODE
        value: live
      - key: HOFJ_API_KEY
        sync: false
      - key: HOFJ_BASE_URL
        sync: false
      - key: HOFJ_BRANDS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VELA_API_TOKEN
        sync: false
      - key: VELA_PUBLIC_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # Landing statica (docs/superpowers/specs/2026-09-26-landing-design.md): si ricostruisce solo
  # per modifiche sotto landing/.
  - type: web
    name: vela-landing
    runtime: static
    buildCommand: echo "Landing statica, nessun build"
    staticPublishPath: ./landing
    buildFilter:
      paths:
        - landing/**

databases:
  - name: vela-db
    region: frankfurt
    plan: free
